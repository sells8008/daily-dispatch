  - {dish: "Grilled Bone-In Pork Chops", method: "Grill", side: "roasted brussels sprouts", note: "Brine 1 hr; grill to 140°F; rest"}
  - {dish: "Slow-Cooker Beef Short Ribs", method: "Slow Cooker", side: "garlic-mashed cauliflower", note: "Sear first; 8 hrs low in stock"}
  - {dish: "Cast-Iron Skirt Steak", method: "Grill", side: "chimichurri & grilled peppers", note: "Very hot, 2–3 min a side, slice against grain"}
  - {dish: "Grilled Chicken Thighs (Peri-Peri)", method: "Grill", side: "grilled zucchini", note: "Marinate 2 hrs; skin-side down first"}
  - {dish: "Slow-Cooker Lamb Shanks", method: "Slow Cooker", side: "roasted carrots & thyme", note: "Sear, then 8 hrs low in red wine + stock"}
