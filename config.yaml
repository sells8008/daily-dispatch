# the published GitHub Pages URL — linked at the top of every emailed edition
site_url: "https://sells8008.github.io/daily-dispatch/"

location:
  label: "Neptune Beach, FL"
  lat: 30.3149
  lon: -81.3984
  timezone: "America/New_York"

email:
  subject_prefix: "The Morning Dispatch"   # final subject: "The Morning Dispatch — Mon, Aug 17"
  # credentials come from GitHub secrets: MAIL_FROM, MAIL_APP_PASSWORD, MAIL_TO

schedule:
  # ~4:30 AM ET. Cron is UTC. 8:30 UTC = 4:30 AM EDT / 5:30 AM EST.
  # NOTE: this value is documentation only — GitHub Actions reads the
  # actual schedule from .github/workflows/daily.yml, not this file.
  cron_utc: "30 8 * * *"

# ---- SPORTS TEAMS ----
teams:
  - {league: "mlb",  name: "Philadelphia Phillies"}
  - {league: "nfl",  name: "Philadelphia Eagles"}
  - {league: "nhl",  name: "Philadelphia Flyers"}
  - {league: "college-football", name: "TCU Horned Frogs"}
  - {league: "mens-college-lacrosse", name: "Jacksonville Dolphins"}   # niche — see caveats
golf:
  follow: ["PGA Tour", "majors", "Ryder Cup"]   # show whatever is in season

# ---- ARTICLE TOPICS ----
# priority 5 = highest (most articles), 1 = lowest. Counts scale with priority.
# never_skip topics always appear even if thin.
topics:
  - {name: "Technology",              priority: 5, freshness: "standard"}
  - {name: "Artificial Intelligence", priority: 5, freshness: "standard"}
  - {name: "Cryptocurrency",          priority: 5, freshness: "fresh"}     # price/market = must be current
  - {name: "American Business",       priority: 4, freshness: "fresh"}
  - {name: "PGA Tour",                priority: 4, freshness: "fresh"}
  - {name: "Food & Cooking",          priority: 4, freshness: "evergreen", never_skip: true}
  - {name: "Space",                   priority: 3, freshness: "standard"}
  - {name: "Scientific Breakthroughs",priority: 3, freshness: "standard"}
  - {name: "Music",                   priority: 3, freshness: "standard", never_skip: true}
  - {name: "Golf History & Courses",  priority: 3, freshness: "evergreen"}
  - {name: "Jacksonville & the Beaches", priority: 3, freshness: "fresh", never_skip: true}
  - {name: "NFL",                     priority: 3, freshness: "fresh"}
  - {name: "MLB",                     priority: 3, freshness: "fresh"}
  - {name: "NHL",                     priority: 3, freshness: "fresh"}     # bumped from priority 1 now that it's a full section, not misc overflow
  - {name: "NCAA Lacrosse",           priority: 2, freshness: "fresh"}
  - {name: "Travel & Destinations",   priority: 3, freshness: "evergreen"} # beautiful US spots + cultural destinations worldwide — age doesn't matter
  - {name: "Travel Deals",            priority: 2, freshness: "fresh"}     # deals must be genuinely current
  - {name: "Capital Markets & Lending (US)", priority: 1, freshness: "fresh"}
  - {name: "US Residential Housing",  priority: 1, freshness: "fresh"}
  # add/remove freely; this is the master list
  # NOTE: "Geopolitics / Current Events" was removed — Top Stories now pulls
  # from Google's own front-page feed (see top_stories_count below), which
  # already covers world events/geopolitics as part of "whatever's the top
  # news of the day," not just one narrow query.

# Rough article counts per priority (tune later). "More is fine."
counts_by_priority: {5: 5, 4: 4, 3: 3, 2: 2, 1: 2}
misc_count: 4   # overflow / catch-all section at the bottom
top_stories_count: 6      # lead story + this many more, any topic
team_news_per_team: 2     # favorite-team-specific articles, per team, in Sports News

# ---- YOUR READS ----
# Followed writers/newsletters. Every source here is always rendered as a
# link to its page; the latest post is shown underneath when its feed can be
# resolved. `feed` is a starting guess — if it fails, the page is checked for
# a declared feed, then /feed, /feed/, /rss, /rss/. So a source with no `feed`
# at all, or a stale one, still works.
# Add or remove freely — no code changes needed.
reads:
  - {name: "The Free Press",         page: "https://www.thefp.com/",                 feed: "https://www.thefp.com/feed"}
  - {name: "Of Dollars and Data",    page: "https://ofdollarsanddata.com/",          feed: "https://ofdollarsanddata.com/feed/"}
  - {name: "Chamath Palihapitiya",   page: "https://chamath.substack.com/",          feed: "https://chamath.substack.com/feed"}
  - {name: "One Useful Thing",       page: "https://www.oneusefulthing.org/",        feed: "https://www.oneusefulthing.org/feed"}
  - {name: "Chartbook (Adam Tooze)", page: "https://adamtooze.substack.com/",        feed: "https://adamtooze.substack.com/feed"}
  - {name: "Postanly Weekly",        page: "https://postanly.substack.com/",         feed: "https://postanly.substack.com/feed"}
  - {name: "Curiosity Chronicle",    page: "https://www.sahilbloom.com/newsletter",  feed: "https://sahilbloom.substack.com/feed"}
  - {name: "Farnam Street",          page: "https://fs.blog/blog/",                  feed: "https://fs.blog/feed/"}
  - {name: "Doomberg",               page: "https://newsletter.doomberg.com/",       feed: "https://newsletter.doomberg.com/feed"}
  - {name: "The Quadrilateral",      page: "https://quadrilateral.substack.com/",    feed: "https://quadrilateral.substack.com/feed"}
  - {name: "Stratechery",            page: "https://stratechery.com/category/articles/", feed: "https://stratechery.com/feed/"}   # free items only
  - {name: "Joe Posnanski",          page: "https://www.joeposnanski.com/",          feed: "https://www.joeposnanski.com/feed/"} # /rss/ 404s; /feed/ is the real one

# ---- PAYWALL FILTER ----
# skip articles from these source domains (hard paywalls, not metered/soft
# ones). Add or remove freely — e.g. drop nytimes.com/washingtonpost.com
# from this list if your Apple News+ access covers them well enough for you.
paywalled_sources:
  - "wsj.com"
  - "ft.com"
  - "bloomberg.com"
  - "theinformation.com"
  - "barrons.com"
  - "theathletic.com"
  - "hbr.org"
  - "economist.com"

