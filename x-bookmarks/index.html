<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>X Bookmarks</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181c;--mut:#687079;--acc:#1d9bf0;--line:#e3e6ea}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#e8eaed;--mut:#9aa1aa;--line:#2a2f37}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--line);z-index:2}
h1{font-size:20px;margin:0 0 10px}.wrap{max-width:860px;margin:0 auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
input[type=search],input[type=date],select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:15px}
input[type=search]{flex:1;min-width:200px}
.chip,.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on,.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:12px 16px 60px}.count{color:var(--mut);font-size:13px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mut);align-items:center}
.cat{background:rgba(29,155,240,.12);color:var(--acc);border-radius:6px;padding:1px 7px;font-weight:600}
.sum{margin:6px 0;font-size:15.5px}a{color:var(--acc);text-decoration:none}
details{font-size:13px;color:var(--mut)}details p{white-space:pre-wrap;margin:6px 0}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
label.done{font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer}
</style></head><body>
<header><div class="wrap"><h1>📚 X Bookmarks</h1>
<div class="row"><button class="tab on" data-v="inbox">To review</button><button class="tab" data-v="arch">Archived</button></div>
<div class="row"><input type="search" id="q" placeholder="Search summary, text, author…">
<select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="saved">Bookmark order</option></select></div>
<div class="row"><input type="date" id="from" title="From"><input type="date" id="to" title="To"></div>
<div class="row" id="chips"></div></div></header>
<main class="wrap"><div class="count" id="count"></div><div id="list"></div></main>
<script>
const K='xbm-done-v1';let done=JSON.parse(localStorage.getItem(K)||'{}');let D=[],view='inbox',cats=new Set();
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;const all=[...new Set(d.map(x=>x.category))].sort();
$('#chips').innerHTML=all.map(c=>`<button class="chip" data-c="${esc(c)}">${esc(c)} <span>${d.filter(x=>x.category==c).length}</span></button>`).join('');render()});
document.addEventListener('click',e=>{const c=e.target.closest('.chip');if(c){const k=c.dataset.c;cats.has(k)?cats.delete(k):cats.add(k);c.classList.toggle('on');render()}
const t=e.target.closest('.tab');if(t){view=t.dataset.v;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b==t));render()}});
document.addEventListener('change',e=>{if(e.target.matches('.cb')){const id=e.target.dataset.id;e.target.checked?done[id]=new Date().toISOString():delete done[id];localStorage.setItem(K,JSON.stringify(done));setTimeout(render,250)}else render()});
$('#q').addEventListener('input',render);
function render(){const q=$('#q').value.toLowerCase().trim(),f=$('#from').value,t=$('#to').value,s=$('#sort').value;
let r=D.filter(x=>(view=='arch')==!!done[x.id]&&(!cats.size||cats.has(x.category))&&(!f||x.date>=f)&&(!t||x.date<=t)&&(!q||(x.summary+' '+x.text+' '+x.author+' '+x.category).toLowerCase().includes(q)));
r.sort((a,b)=>s=='saved'?a.order-b.order:s=='old'?a.date.localeCompare(b.date):b.date.localeCompare(a.date));
$('#count').textContent=`${r.length} ${view=='arch'?'archived':'to review'} · ${D.filter(x=>!done[x.id]).length} unreviewed total`;
$('#list').innerHTML=r.map(x=>`<div class="card"><div class="meta"><span class="cat">${esc(x.category)}</span><span>${esc(x.date)}</span><a href="https://x.com/${esc(x.author)}" target="_blank">@${esc(x.author)}</a></div>
<div class="sum">${esc(x.summary)}</div><details><summary>Post text</summary><p>${esc(x.text)}</p></details>
<div class="foot"><a href="${esc(x.url)}" target="_blank" rel="noopener">Open on X ↗</a><label class="done"><input type="checkbox" class="cb" data-id="${x.id}" ${done[x.id]?'checked':''}> ${view=='arch'?'Done (uncheck to unarchive)':'Done'}</label></div></div>`).join('')||'<p class="count">Nothing here.</p>'}
</script></body></html>
