name: Daily Dispatch

on:
  schedule:
    # GitHub's `schedule:` is best-effort — runs are routinely delayed and,
    # under load, dropped entirely (that's what happened on 2026-08-27: no
    # run fired at all). So there are three slots: the first is the target,
    # the rest are safety nets. The guard step below makes the extra slots
    # no-ops on any day the earlier one already published, so a normal day
    # still produces exactly one edition and one email.
    #
    # Times are UTC. 8:07 UTC = 4:07 AM EDT / 5:07 AM EST — DST shifts this
    # by an hour twice a year; nudge each entry +1h for the Nov-Mar stretch
    # if you want a fixed local time year-round.
    #
    # Deliberately odd minutes: GitHub queues every repo's crons together, so
    # :00 and :30 are the most congested slots. On the old :30 schedule this
    # workflow fired 76-112 min late every single day (an 8:30 target landing
    # 09:46-10:22 UTC — i.e. mail arriving ~6 AM ET, not the intended 4:30).
    - cron: "7 8 * * *"     # target: ~4:07 AM ET
    - cron: "7 10 * * *"    # safety net if the first slot was dropped
    - cron: "7 12 * * *"    # last resort
  # Also triggered each morning by an external scheduler calling the GitHub
  # API (see README), because GitHub's own `schedule:` above has proven
  # unreliable — it stopped firing entirely for this repo on 2026-08-27.
  # An API trigger sends no inputs, so `force` is empty and the guard below
  # still applies: if the day's edition already went out, the run no-ops.
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and resend even if today's edition already went out"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      # Runners are UTC. Without this the edition's masthead date, "Generated"
      # time, recipe day-of-year, and the day-seeded article rotation all key
      # off UTC rather than the reader's actual timezone.
      TZ: America/New_York
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if today's edition already published
        id: guard
        run: |
          TODAY=$(date +%F)
          if [ "${{ github.event.inputs.force }}" != "true" ] \
             && [ -f .last-edition ] \
             && [ "$(cat .last-edition)" = "$TODAY" ]; then
            echo "Edition for $TODAY already published — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: pip install -r requirements.txt

      - name: Build and email today's edition
        if: steps.guard.outputs.skip == 'false'
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python build.py

      - name: Commit and push regenerated index.html
        if: steps.guard.outputs.skip == 'false'
        run: |
          date +%F > .last-edition
          git config user.name "daily-dispatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .last-edition
          git diff --cached --quiet && echo "no changes" || git commit -m "Daily edition: $(date +%F)"
          # Another run (or a local push) may have landed since checkout.
          git pull --rebase origin main
          git push
