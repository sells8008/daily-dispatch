name: Daily Dispatch

on:
  schedule:
    # 10:00 UTC = 6 AM EDT / 5 AM EST. DST shifts this by an hour twice a
    # year — nudge this cron if you want a fixed local time year-round.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and email today's edition
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python build.py

      - name: Commit and push regenerated index.html
        run: |
          git config user.name "daily-dispatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "no changes" || git commit -m "Daily edition: $(date -u +%Y-%m-%d)"
          git push
